[project]
name = "project-aura"
version = "0.1.0"
description = "Cognitive Swarm for Luxury Hospitality AI"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
